services:
  insecure-all:
    image: ubuntu:latest
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    userns_mode: host
    ports:
      - "8080:80"
      - "5432:5432"
    cap_add:
      - ALL
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_PTRACE
      - SYS_MODULE
      - DAC_READ_SEARCH
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0:rwm"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/etc:/host-etc:rw"
      - "/root:/host-root:ro"
    environment:
      POSTGRES_PASSWORD: super_secret_literal_password
      API_KEY: "hardcoded-api-key-12345"

  list-env-and-tag-no-digest:
    image: nginx:1.27-alpine
    user: "root:root"
    environment:
      - JWT_SECRET=my_literal_jwt_secret
      - ACCESS_TOKEN=tok_live_987654321
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256M

  published:
    image: nginx:1.27-alpine
    network_mode: bridge
    ports:
      - "8080:80"
      - "5432:5432"

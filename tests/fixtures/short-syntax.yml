name: short-syntax-demo

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "127.0.0.1:8443:443"
      - "[::1]:9090:9090"
      - "8000-8005:8000-8005/udp"
      - "3000"
    expose:
      - "8081"
      - "9000/udp"
    volumes:
      - "./html:/usr/share/nginx/html:ro"
      - "app_cache:/var/cache/nginx"
      - "/var/log/nginx"
    tmpfs:
      - "/run"
      - "/tmp:ro,size=64m"
    environment:
      - NODE_ENV=production
      - EMPTY_VAL=
      - PASSTHROUGH_ONLY
    depends_on:
      - api
      - redis

  api:
    image: node:22-alpine
    networks:
      - backend

  redis:
    image: redis:7-alpine
    networks:
      - backend

networks:
  backend:

volumes:
  app_cache:
